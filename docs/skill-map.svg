<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">体观康复 Skills v0.2.0 能力地图</title>
  <desc id="desc">不要求知识库、客户档案、经营表或系统接口；引导入口从当前可提供内容开始，只在五条 Day-0 路径中路由。</desc>
  <defs>
    <style>
      .bg{fill:#f3efe4}.ink{fill:#17352d}.card{fill:#fffdf6;stroke:#17352d;stroke-width:3}.accent{fill:#b1462f}.title{font:700 34px 'Noto Serif SC','Songti SC',serif;fill:#fffdf6}.head{font:700 23px 'Noto Sans SC','PingFang SC',sans-serif;fill:#17352d}.body{font:500 16px 'Noto Sans SC','PingFang SC',sans-serif;fill:#56645f}.white{fill:#fffdf6}.line{stroke:#17352d;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1400" height="1100" class="bg"/>
  <rect x="70" y="45" width="1260" height="90" rx="5" class="ink"/>
  <text x="110" y="102" class="title">体观康复 Skills v0.2.0 · 放大你已有的循证与经营判断</text>

  <rect x="330" y="180" width="740" height="110" rx="8" class="card"/>
  <rect x="330" y="180" width="16" height="110" class="accent"/>
  <text x="390" y="226" class="head">/tiguan-rehab 引导入口</text>
  <text x="390" y="260" class="body">零基础设施可开始 · 最高需求 × 当前材料 · 只路由已发布能力</text>

  <path d="M700 290V340M190 340H1210M190 340V380M525 340V380M875 340V380M1210 340V380" class="line"/>

  <rect x="70" y="380" width="280" height="250" rx="8" class="card"/>
  <text x="105" y="425" class="head">实践认知校准</text>
  <text x="105" y="466" class="body">/tiguan-source-to-practice</text>
  <text x="105" y="496" class="body">先讲理解 → 对照偏差 → 验证</text>
  <text x="105" y="546" class="body">/tiguan-post-session-questioning</text>
  <text x="105" y="576" class="body">知 × 行 → 多轮追问</text>

  <rect x="385" y="380" width="280" height="250" rx="8" class="card"/>
  <text x="420" y="425" class="head">可验证服务设计</text>
  <text x="420" y="466" class="body">/tiguan-assessment-session-design</text>
  <text x="420" y="496" class="body">附加直接调用：问卷 → 课前准备</text>
  <text x="420" y="546" class="body">/tiguan-service-ops</text>
  <text x="420" y="576" class="body">口述 → 草稿；有接口再执行</text>

  <rect x="700" y="380" width="280" height="250" rx="8" class="card"/>
  <text x="735" y="425" class="head">专业价值可见化</text>
  <text x="735" y="466" class="body">/tiguan-practice-knowledge-base</text>
  <text x="735" y="496" class="body">从当前结果建立第一个条目</text>
  <text x="735" y="546" class="body">来源 · 判断 · 验证状态</text>

  <rect x="1015" y="380" width="315" height="250" rx="8" class="card"/>
  <text x="1050" y="425" class="head">执业系统诊断</text>
  <text x="1050" y="466" class="body">/tiguan-business-review</text>
  <text x="1050" y="496" class="body">无数据 → 7 天最小采集表</text>
  <text x="1050" y="546" class="body">有数据 → 缺失 ≠ 0</text>
  <text x="1050" y="576" class="body">一次只找一个优先级</text>

  <rect x="110" y="700" width="1180" height="220" rx="8" class="ink"/>
  <text x="160" y="755" class="head white">同一条使用闭环</text>
  <text x="160" y="808" class="body white">真实问题 → 脱敏输入 → AI 整理 / 计算 / 质询 / 预览 → 人审核</text>
  <text x="160" y="855" class="body white">→ 真实执行 → 带回新证据 → 改变下一次判断</text>

  <rect x="110" y="965" width="1180" height="70" rx="5" class="card"/>
  <text x="155" y="1008" class="head">AI 放大判断，不替代专业、安全、客户面向和经营责任</text>
