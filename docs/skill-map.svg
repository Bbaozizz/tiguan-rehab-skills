<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">体观康复 Skills 完整能力地图与当前开放状态</title>
  <desc id="desc">康复学生、机构康复师、个人门店康复师与机构负责人，通过统一入口进入实践认知校准、可验证服务设计、专业价值可见化和执业系统诊断四个长期能力簇。当前已发布统一入口和评估课设计，其他能力仍在规划中。</desc>
  <defs>
    <style>
      .bg{fill:#f3efe4}.ink{fill:#17352d}.paper{fill:#fffdf6;stroke:#17352d;stroke-width:3}.planned{fill:#ece6d8;stroke:#8d8a80;stroke-width:2.5;stroke-dasharray:10 8}.released{fill:#fffdf6;stroke:#17352d;stroke-width:4}.accent{fill:#b1462f}.title{font:700 34px 'Noto Serif SC','Songti SC',serif;fill:#fffdf6}.section{font:700 24px 'Noto Sans SC','PingFang SC',sans-serif;fill:#17352d}.label{font:700 21px 'Noto Sans SC','PingFang SC',sans-serif;fill:#17352d}.small{font:500 15px 'Noto Sans SC','PingFang SC',sans-serif;fill:#68736d}.tiny{font:500 13px 'Noto Sans SC','PingFang SC',sans-serif;fill:#68736d}.white{fill:#fffdf6}.line{stroke:#17352d;stroke-width:4;fill:none;marker-end:url(#arrow)}.softline{stroke:#8d8a80;stroke-width:2.5;fill:none;stroke-dasharray:8 7}.pill{fill:#fffdf6;stroke:#c8c1b2;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" class="ink"/></marker>
