name: Public Release Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.158
      - name: Validate public contract
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/check-publication-readiness.py
          python3 tools/check-routing-contract.py
      - name: Validate Skills
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text())
          for item in plugin["skills"]:
              subprocess.run(["python3", "tools/quick_validate_skill.py", item.removeprefix("./")], check=True)
          PY
          claude plugin validate .
      - name: Build release bundle
        run: bash tools/build-skills.sh

  verify-workbuddy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native WorkBuddy installation
        shell: pwsh
        run: |
          $WorkBuddyHome = Join-Path $env:RUNNER_TEMP ".workbuddy"
          $PrivateSkill = Join-Path $WorkBuddyHome "skills/my-private-skill/SKILL.md"
          New-Item -ItemType Directory -Path (Split-Path $PrivateSkill) -Force | Out-Null
          Set-Content -LiteralPath $PrivateSkill -Value "keep me" -NoNewline

          & "$PWD/tools/install-workbuddy.ps1" -SourceDir "$PWD" -WorkBuddyHome $WorkBuddyHome

          $Plugin = Get-Content -LiteralPath "$PWD/.claude-plugin/plugin.json" -Raw | ConvertFrom-Json
          foreach ($Name in $Plugin.skills | ForEach-Object { $_.Substring("./skills/".Length) }) {
            $SkillFile = Join-Path $WorkBuddyHome "skills/$Name/SKILL.md"
            if (-not (Test-Path -LiteralPath $SkillFile -PathType Leaf)) {
              throw "Missing installed Skill: $Name"
            }
          }
          if ((Get-Content -LiteralPath $PrivateSkill -Raw) -ne "keep me") {
            throw "Installer changed my-private-skill"
          }

          $StaleFile = Join-Path $WorkBuddyHome "skills/tiguan-rehab/stale.txt"
          Set-Content -LiteralPath $StaleFile -Value "old"
          & "$PWD/tools/install-workbuddy.ps1" -SourceDir "$PWD" -WorkBuddyHome $WorkBuddyHome
          if (Test-Path -LiteralPath $StaleFile) {
            throw "Reinstall did not replace the managed Skill"
          }
